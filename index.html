function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function GraphDisplay({ graph }) {
  if (!graph) return null;
  const W = 420, H = 320, PAD = 45;

  if (graph.custom === "circular") {
    return (
      <svg viewBox="0 0 420 280" style={{ width: "100%", maxWidth: 420, display: "block", margin: "0 auto" }}>
        <rect x="0" y="0" width="420" height="280" rx="12" fill="rgba(0,0,0,0.3)" />
        {/* Firms box */}
        <rect x="60" y="30" width="120" height="50" rx="8" fill="rgba(239,83,80,0.15)" stroke="#ef5350" strokeWidth="1.5"/>
        <text x="120" y="60" textAnchor="middle" fill="#ef5350" fontSize="13" fontWeight="600" fontFamily="Trebuchet MS">Firms</text>
        {/* Households box */}
        <rect x="240" y="30" width="120" height="50" rx="8" fill="rgba(66,165,245,0.15)" stroke="#42a5f5" strokeWidth="1.5"/>
        <text x="300" y="60" textAnchor="middle" fill="#42a5f5" fontSize="13" fontWeight="600" fontFamily="Trebuchet MS">Households</text>
        {/* Top arrow: Goods & services */}
        <path d="M180,45 Q210,20 240,45" fill="none" stroke="#aed581" strokeWidth="2" markerEnd="url(#arrowG)"/>
        <text x="210" y="18" textAnchor="middle" fill="#aed581" fontSize="9" fontFamily="Trebuchet MS">Goods & services</text>
        {/* Bottom arrow: Factor payments */}
        <path d="M240,65 Q210,90 180,65" fill="none" stroke="#ffd54f" strokeWidth="2" markerEnd="url(#arrowY)"/>
        <text x="210" y="100" textAnchor="middle" fill="#ffd54f" fontSize="9" fontFamily="Trebuchet MS">Factor payments (wages, rent, profit)</text>
        {/* Withdrawals */}
        <rect x="140" y="130" width="140" height="40" rx="6" fill="rgba(206,147,216,0.1)" stroke="#ce93d8" strokeWidth="1"/>
        <text x="210" y="155" textAnchor="middle" fill="#ce93d8" fontSize="11" fontWeight="600" fontFamily="Trebuchet MS">Withdrawals (S + T + M)</text>
        <line x1="210" y1="80" x2="210" y2="130" stroke="#ce93d8" strokeWidth="1.5" strokeDasharray="4,3" markerEnd="url(#arrowP)"/>
        {/* Injections */}
        <rect x="140" y="190" width="140" height="40" rx="6" fill="rgba(102,187,106,0.1)" stroke="#66bb6a" strokeWidth="1"/>
        <text x="210" y="215" textAnchor="middle" fill="#66bb6a" fontSize="11" fontWeight="600" fontFamily="Trebuchet MS">Injections (I + G + X)</text>
        <line x1="210" y1="230" x2="210" y2="258" stroke="#66bb6a" strokeWidth="1.5" strokeDasharray="4,3" markerEnd="url(#arrowGn)"/>
        <text x="210" y="270" textAnchor="middle" fill="#8eaccd" fontSize="10" fontFamily="Trebuchet MS">Equilibrium when J = W</text>
        {/* Arrow markers */}
        <defs>
          <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#aed581"/></marker>
          <marker id="arrowY" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#ffd54f"/></marker>
          <marker id="arrowP" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#ce93d8"/></marker>
          <marker id="arrowGn" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#66bb6a"/></marker>
        </defs>
      </svg>
    );
  }

  const makePath = (pts) => pts.map((p, i) => {
    if (i === 0) return `M${p[0]},${p[1]}`;
    const prev = pts[i - 1];
    const cx = (prev[0] + p[0]) / 2;
    return `Q${cx},${prev[1]} ${p[0]},${p[1]}`;
  }).join(" ");

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", maxWidth: W, display: "block", margin: "0 auto" }}>
      <rect x="0" y="0" width={W} height={H} rx="12" fill="rgba(0,0,0,0.3)" />
      {/* Grid lines */}
      {[1,2,3,4].map(i => (
        <line key={`gy${i}`} x1={PAD} y1={PAD + (H - 2*PAD)*i/5} x2={W - 10} y2={PAD + (H - 2*PAD)*i/5} stroke="rgba(255,255,255,0.04)" strokeWidth="1"/>
      ))}
      {/* Axes */}
      <line x1={PAD} y1={PAD - 5} x2={PAD} y2={H - PAD + 5} stroke="rgba(255,255,255,0.35)" strokeWidth="1.5"/>
      <line x1={PAD - 5} y1={H - PAD} x2={W - 10} y2={H - PAD} stroke="rgba(255,255,255,0.35)" strokeWidth="1.5"/>
      {/* Axis labels */}
      <text x={W / 2} y={H - 5} textAnchor="middle" fill="rgba(255,255,255,0.5)" fontSize="11" fontFamily="Trebuchet MS">{graph.xLabel}</text>
      <text x="12" y={H / 2} textAnchor="middle" fill="rgba(255,255,255,0.5)" fontSize="11" fontFamily="Trebuchet MS" transform={`rotate(-90,12,${H/2})`}>{graph.yLabel}</text>

      {/* Half-divide background regions */}
      {graph.halfDivide && <>
        <rect x={PAD} y={PAD} width={graph.halfDivide.x - PAD} height={H - 2*PAD} fill={graph.halfDivide.topColor} />
        <rect x={graph.halfDivide.x} y={PAD} width={W - 10 - graph.halfDivide.x} height={H - 2*PAD} fill={graph.halfDivide.bottomColor} />
      </>}

      {/* Shaded box (supernormal profit) */}
      {graph.shadedBox && (
        <rect x={graph.shadedBox.x1} y={graph.shadedBox.y1} width={graph.shadedBox.x2 - graph.shadedBox.x1} height={graph.shadedBox.y2 - graph.shadedBox.y1} fill={graph.shadedBox.color} stroke={graph.shadedBox.border} strokeWidth="1" strokeDasharray="4,3" />
      )}

      {/* DWL Triangle */}
      {graph.dwlTriangle && (
        <polygon points={graph.dwlTriangle.points.map(p => p.join(",")).join(" ")} fill={graph.dwlTriangle.color} stroke={graph.dwlTriangle.border} strokeWidth="1.5" />
      )}

      {/* Surplus gap */}
      {graph.surplusGap && (
        <rect x={graph.surplusGap.xD} y={graph.surplusGap.y - 12} width={graph.surplusGap.xS - graph.surplusGap.xD} height={24} rx="4" fill={graph.surplusGap.color} stroke={graph.surplusGap.border} strokeWidth="1" strokeDasharray="3,3" />
      )}

      {/* Unemployment gap */}
      {graph.unemploymentGap && <>
        <line x1={graph.unemploymentGap.x1} y1={graph.unemploymentGap.y} x2={graph.unemploymentGap.x2} y2={graph.unemploymentGap.y} stroke={graph.unemploymentGap.color} strokeWidth="3" />
        <line x1={graph.unemploymentGap.x1} y1={graph.unemploymentGap.y - 8} x2={graph.unemploymentGap.x1} y2={graph.unemploymentGap.y + 8} stroke={graph.unemploymentGap.color} strokeWidth="2" />
        <line x1={graph.unemploymentGap.x2} y1={graph.unemploymentGap.y - 8} x2={graph.unemploymentGap.x2} y2={graph.unemploymentGap.y + 8} stroke={graph.unemploymentGap.color} strokeWidth="2" />
      </>}

      {/* Bracket regions */}
      {graph.bracketRegions && graph.bracketRegions.map((b, i) => (
        <line key={`br${i}`} x1={b.x1} y1={b.y} x2={b.x2} y2={b.y} stroke={b.color} strokeWidth="3" strokeLinecap="round" />
      ))}

      {/* Horizontal dashed lines */}
      {(graph.dashed || []).filter(d => d.y).map((d, i) => (
        <g key={`dh${i}`}>
          <line x1={PAD} y1={d.y} x2={W - 10} y2={d.y} stroke={d.color} strokeWidth="1.5" strokeDasharray="6,4" />
          {d.label && <text x={PAD - 5} y={d.y + 4} textAnchor="end" fill={d.color} fontSize="11" fontWeight="600" fontFamily="Trebuchet MS">{d.label}</text>}
        </g>
      ))}

      {/* Vertical dashed lines */}
      {(graph.dashed || []).filter(d => d.x).map((d, i) => (
        <g key={`dv${i}`}>
          <line x1={d.x} y1={PAD} x2={d.x} y2={H - PAD} stroke={d.color} strokeWidth="1.5" strokeDasharray="6,4" />
          {d.label && <text x={d.x} y={H - PAD + 14} textAnchor="middle" fill={d.color} fontSize="10" fontFamily="Trebuchet MS">{d.label}</text>}
        </g>
      ))}

      {/* Guide lines */}
      {(graph.guideLines || []).map((g2, i) => (
        <line key={`gl${i}`} x1={g2.from[0]} y1={g2.from[1]} x2={g2.to[0]} y2={g2.to[1]} stroke={g2.color} strokeWidth="1.5" strokeDasharray="5,3" />
      ))}

      {/* Bracket lines */}
      {(graph.bracketLines || []).map((b, i) => (
        <g key={`bl${i}`}>
          <line x1={b.x} y1={b.y1} x2={b.x} y2={b.y2} stroke={b.color} strokeWidth="2" />
          <line x1={b.x - 4} y1={b.y1} x2={b.x + 4} y2={b.y1} stroke={b.color} strokeWidth="2" />
          <line x1={b.x - 4} y1={b.y2} x2={b.x + 4} y2={b.y2} stroke={b.color} strokeWidth="2" />
        </g>
      ))}

      {/* Curves */}
      {(graph.curves || []).map(c => (
        <path key={c.id} d={makePath(c.points)} fill="none" stroke={c.color} strokeWidth={c.dashed ? 1.5 : 2.5} strokeDasharray={c.dashed ? "8,5" : "none"} strokeLinecap="round" />
      ))}

      {/* Curve labels */}
      {(graph.curves || []).map(c => c.labelPos && (
        <text key={`lbl-${c.id}`} x={c.labelPos[0]} y={c.labelPos[1]} fill={c.color} fontSize="11" fontWeight="700" fontFamily="Trebuchet MS">{c.label}</text>
      ))}

      {/* Arrows */}
      {(graph.arrows || []).map((a, i) => (
        <g key={`arr${i}`}>
          <line x1={a.from[0]} y1={a.from[1]} x2={a.to[0]} y2={a.to[1]} stroke={a.color} strokeWidth="2.5" markerEnd="url(#arrowHead)" />
        </g>
      ))}

      {/* Dots */}
      {(graph.dots || []).map((d, i) => (
        <g key={`dot${i}`}>
          <circle cx={d.x} cy={d.y} r="5" fill={d.color} stroke="rgba(0,0,0,0.3)" strokeWidth="1" />
          {d.label && d.label.split("\\n").map((line, li) => (
            <text key={li} x={d.x + 10} y={d.y - 6 + li * 13} fill={d.color} fontSize="10" fontWeight="700" fontFamily="Trebuchet MS">{line}</text>
          ))}
        </g>
      ))}

      {/* Annotations */}
      {(graph.annotations || []).map((a, i) => (
        <g key={`ann${i}`}>
          {a.text.split("\\n").map((line, li) => (
            <text key={li} x={a.x} y={a.y + li * 14} fill={a.color} fontSize="10" fontStyle="italic" fontFamily="Trebuchet MS">{line}</text>
          ))}
        </g>
      ))}

      {/* Arrow marker def */}
      <defs>
        <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
          <polygon points="0,0 10,3.5 0,7" fill="#ffd54f" />
        </marker>
      </defs>
    </svg>
  );
}

const GLOSSARY = {
  "SRAC": { full: "Short-Run Average Cost", desc: "The average cost per unit when at least one factor of production is fixed. Each SRAC curve represents a different plant size." },
  "LRAC": { full: "Long-Run Average Cost", desc: "The lowest average cost achievable for each output level when ALL factors are variable. It forms an 'envelope' of all possible SRAC curves." },
  "LRMC": { full: "Long-Run Marginal Cost", desc: "The cost of producing one extra unit when all factors of production can be adjusted." },
  "MC": { full: "Marginal Cost", desc: "The extra cost of producing one more unit of output. MC = ΔTC / ΔQ. The MC curve is U-shaped due to diminishing returns." },
  "AC": { full: "Average Cost", desc: "Total cost divided by quantity produced. AC = TC / Q. Also called ATC (Average Total Cost). It equals AVC + AFC." },
  "AVC": { full: "Average Variable Cost", desc: "Variable costs per unit of output. AVC = TVC / Q. The shut-down point is where P = AVC (minimum)." },
  "AFC": { full: "Average Fixed Cost", desc: "Fixed costs per unit of output. AFC = TFC / Q. It falls continuously as output rises because fixed costs are spread over more units." },
  "ATC": { full: "Average Total Cost", desc: "Same as AC. Total cost per unit: ATC = TC / Q = AFC + AVC." },
  "TC": { full: "Total Cost", desc: "The sum of all costs of production. TC = TFC + TVC (Total Fixed Costs + Total Variable Costs)." },
  "TFC": { full: "Total Fixed Cost", desc: "Costs that do not change with output in the short run (e.g. rent, insurance). Must be paid even if output is zero." },
  "TVC": { full: "Total Variable Cost", desc: "Costs that change with the level of output (e.g. raw materials, hourly wages). TVC = 0 when output = 0." },
  "MR": { full: "Marginal Revenue", desc: "The extra revenue from selling one more unit. MR = ΔTR / ΔQ. For a price taker, MR = P. For a price maker, MR < P." },
  "AR": { full: "Average Revenue", desc: "Revenue per unit sold. AR = TR / Q = Price. The AR curve is the firm's demand curve." },
  "TR": { full: "Total Revenue", desc: "The total income from sales. TR = Price × Quantity. Maximised where MR = 0 (unit elastic point)." },
  "PED": { full: "Price Elasticity of Demand", desc: "Measures how responsive quantity demanded is to a price change. PED = %ΔQD / %ΔP. Elastic if |PED| > 1, inelastic if |PED| < 1." },
  "YED": { full: "Income Elasticity of Demand", desc: "Measures how demand responds to income changes. YED = %ΔQD / %ΔY. Positive for normal goods, negative for inferior goods." },
  "XED": { full: "Cross-Price Elasticity of Demand", desc: "Measures how demand for good A responds to a price change in good B. Positive = substitutes, negative = complements." },
  "AD": { full: "Aggregate Demand", desc: "Total spending in the economy. AD = C + I + G + X − M (Consumption + Investment + Gov. spending + Exports − Imports)." },
  "AS": { full: "Aggregate Supply", desc: "The total output all firms in the economy plan to produce at each price level. Slopes upward in the short run." },
  "GDP": { full: "Gross Domestic Product", desc: "The total value of goods and services produced within a country over a period (usually 12 months). Can be nominal or real." },
  "MSB": { full: "Marginal Social Benefit", desc: "The total benefit to society of consuming one more unit, including both private benefits and external benefits to third parties." },
  "MSC": { full: "Marginal Social Cost", desc: "The total cost to society of producing one more unit, including both private costs and external costs (e.g. pollution)." },
  "MPB": { full: "Marginal Private Benefit", desc: "The benefit to the individual consumer of consuming one more unit, not accounting for effects on others." },
  "MPC": { full: "Marginal Private Cost", desc: "The cost to the individual producer of producing one more unit, not accounting for external costs imposed on others." },
  "MEC": { full: "Marginal External Cost", desc: "The cost imposed on third parties per additional unit produced or consumed. MEC = MSC − MPC." },
  "TPP": { full: "Total Physical Product", desc: "The total output produced by all units of the variable factor. TPP first rises at an increasing rate, then at a decreasing rate." },
  "MPP": { full: "Marginal Physical Product", desc: "The extra output from employing one more unit of the variable factor. MPP eventually falls due to diminishing returns." },
  "APP": { full: "Average Physical Product", desc: "Output per unit of the variable factor. APP = TPP / number of workers. MPP crosses APP at its maximum." },
  "ADL": { full: "Aggregate Demand for Labour", desc: "The total demand for workers across the whole economy at different real wage rates. Slopes downward." },
  "ASL": { full: "Aggregate Supply of Labour", desc: "The total number of people willing and able to work at different real wage rates. Slopes upward." },
  "MB": { full: "Marginal Benefit", desc: "The extra benefit (utility or revenue) gained from one additional unit of an activity. Rational decisions compare MB with MC." },
  "OPEC": { full: "Organization of the Petroleum Exporting Countries", desc: "A cartel of oil-producing nations that coordinates production to influence oil prices. An example of oligopolistic collusion." },
};

// Build a regex that matches glossary terms (longest first to avoid partial matches)
const TERM_REGEX = new RegExp(
  `\\b(${Object.keys(GLOSSARY).sort((a, b) => b.length - a.length).join("|")})\\b`,
  "g"
);

function TermHighlighter({ text, accentColor = "#ffd54f" }) {
  const [activeTerm, setActiveTerm] = useState(null);

  if (!text) return null;

  const parts = [];
  let lastIndex = 0;
  let match;
  const regex = new RegExp(TERM_REGEX.source, "g");

  while ((match = regex.exec(text)) !== null) {
    if (match.index > lastIndex) {
      parts.push({ type: "text", value: text.slice(lastIndex, match.index) });
    }
    parts.push({ type: "term", value: match[0], index: match.index });
    lastIndex = match.index + match[0].length;
  }
  if (lastIndex < text.length) {
    parts.push({ type: "text", value: text.slice(lastIndex) });
  }

  // If no terms found, just return text
  if (parts.length === 1 && parts[0].type === "text") {
    return text;
  }

  return (
    <span style={{ position: "relative" }}>
      {parts.map((p, i) => {
        if (p.type === "text") return <span key={i}>{p.value}</span>;
        const entry = GLOSSARY[p.value];
        const isActive = activeTerm === p.index;
        return (
          <span key={i} style={{ position: "relative", display: "inline" }}>
            <span
              onClick={(e) => {
                e.stopPropagation();
                setActiveTerm(isActive ? null : p.index);
              }}
              style={{
                color: accentColor,
                borderBottom: `1px dashed ${accentColor}88`,
                cursor: "pointer",
                fontWeight: 700,
                transition: "opacity 0.2s"
              }}
            >
              {p.value}
            </span>
            {isActive && entry && (
              <span
                onClick={(e) => e.stopPropagation()}
                style={{
                  position: "absolute",
                  bottom: "calc(100% + 8px)",
                  left: "50%",
                  transform: "translateX(-50%)",
                  background: "#1a2332",
                  border: `1px solid ${accentColor}55`,
                  borderRadius: 10,
                  padding: "12px 14px",
                  width: 260,
                  zIndex: 1000,
                  boxShadow: `0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px ${accentColor}22`,
                  animation: "fadeUp 0.2s ease"
                }}
              >
                <span style={{
                  display: "block",
                  color: accentColor,
                  fontSize: 12,
                  fontWeight: 800,
                  letterSpacing: 1,
                  fontFamily: "'Trebuchet MS', sans-serif",
                  marginBottom: 2
                }}>{p.value}</span>
                <span style={{
                  display: "block",
                  color: "#b0bec5",
                  fontSize: 11,
                  fontStyle: "italic",
                  marginBottom: 6,
                  fontFamily: "'Trebuchet MS', sans-serif"
                }}>{entry.full}</span>
                <span style={{
                  display: "block",
                  color: "#cfd8dc",
                  fontSize: 12,
                  lineHeight: 1.55,
                  fontFamily: "'Trebuchet MS', sans-serif"
                }}>{entry.desc}</span>
                {/* Arrow */}
                <span style={{
                  position: "absolute",
                  bottom: -6,
                  left: "50%",
                  transform: "translateX(-50%)",
                  width: 0,
                  height: 0,
                  borderLeft: "6px solid transparent",
                  borderRight: "6px solid transparent",
                  borderTop: `6px solid ${accentColor}55`
                }} />
              </span>
            )}
          </span>
        );
      })}
    </span>
  );
}

            {currentQ === 0 && <div style={{ color: "rgba(255,255,255,0.3)", fontSize: 11, marginTop: 10, fontFamily: "'Trebuchet MS', sans-serif" }}>💡 Tap highlighted terms like <span style={{ color: tc.accent, borderBottom: `1px dashed ${tc.accent}66`, fontWeight: 700 }}>MC</span> or <span style={{ color: tc.accent, borderBottom: `1px dashed ${tc.accent}66`, fontWeight: 700 }}>LRAC</span> for definitions</div>}
          </div>

          {/* Graph Display */}
          {q.graph && (
            <div style={{
              background: "rgba(255,255,255,0.04)",
              borderRadius: 14,
              padding: "16px 12px",
              marginBottom: 20,
              border: "1px solid rgba(255,255,255,0.06)"
            }}>
              <GraphDisplay graph={q.graph} />
            </div>
          )}

          {/* Options */}
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {q.options.map((opt, idx) => {
              const isSelected = selectedAnswer === idx;
              const isCorrect = idx === q.correct;
              const answered = selectedAnswer !== null;
              let bg = "rgba(255,255,255,0.05)";
              let borderCol = "rgba(255,255,255,0.1)";
              let textCol = "#e0e0e0";

              if (answered) {
                if (isCorrect) {
                  bg = "rgba(76,175,80,0.2)";
                  borderCol = "#4caf50";
                  textCol = "#c8e6c9";
                } else if (isSelected && !isCorrect) {
                  bg = "rgba(244,67,54,0.2)";
                  borderCol = "#f44336";
                  textCol = "#ffcdd2";
                }
              }

              return (
                <button
                  key={idx}
                  onClick={() => handleAnswer(idx)}
                  disabled={answered}
                  style={{
                    display: "flex",
                    alignItems: "flex-start",
                    gap: 14,
                    padding: "16px 18px",
                    borderRadius: 12,
                    border: `2px solid ${borderCol}`,
                    background: bg,
                    cursor: answered ? "default" : "pointer",
                    textAlign: "left",
                    transition: "all 0.25s ease",
                    opacity: answered && !isSelected && !isCorrect ? 0.5 : 1
                  }}
                >
                  <div style={{
                    width: 28,
                    height: 28,
                    borderRadius: 8,
                    background: answered && isCorrect ? "#4caf50" : answered && isSelected ? "#f44336" : "rgba(255,255,255,0.1)",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    flexShrink: 0,
                    fontSize: 13,
                    fontWeight: 700,
                    color: answered && (isCorrect || isSelected) ? "#fff" : "#8eaccd",
                    fontFamily: "'Trebuchet MS', sans-serif"
                  }}>
                    {answered && isCorrect ? "✓" : answered && isSelected ? "✗" : String.fromCharCode(65 + idx)}
                  </div>
                  <div style={{
                    color: textCol,
                    fontSize: 15,
                    lineHeight: 1.5,
                    paddingTop: 3
                  }}><TermHighlighter text={opt} accentColor={answered && isCorrect ? "#c8e6c9" : answered && isSelected ? "#ffcdd2" : tc.accent} /></div>
                </button>
              );
            })}
          </div>

          {/* Explanation (shown on wrong answer) */}
          {showExplanation && (
            <div style={{
              marginTop: 20,
              padding: 24,
              borderRadius: 14,
              background: "rgba(255,152,0,0.1)",
              border: "1px solid rgba(255,152,0,0.3)",
              animation: "fadeUp 0.4s ease"
            }}>
              <div style={{
                display: "flex",
                alignItems: "center",
                gap: 8,
                marginBottom: 10
              }}>
                <span style={{ fontSize: 18 }}>💡</span>
                <span style={{
                  color: "#ffcc80",
                  fontSize: 13,
                  letterSpacing: 2,
                  textTransform: "uppercase",
                  fontWeight: 700,
                  fontFamily: "'Trebuchet MS', sans-serif"
                }}>Explanation</span>
              </div>
              <p style={{
                color: "#e0e0e0",
                fontSize: 15,
                lineHeight: 1.7,
                margin: 0
              }}><TermHighlighter text={q.explanation} accentColor="#ffcc80" /></p>
            </div>
          )}

          {/* Correct answer acknowledgment */}
          {selectedAnswer !== null && selectedAnswer === q.correct && (
            <div style={{
              marginTop: 20,
              padding: "16px 24px",
              borderRadius: 14,
              background: "rgba(76,175,80,0.12)",
              border: "1px solid rgba(76,175,80,0.3)",
              animation: "fadeUp 0.4s ease"
            }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 20 }}>🎯</span>
                <span style={{ color: "#a5d6a7", fontSize: 15, fontWeight: 600 }}>Correct!</span>
              </div>
              {q.explanation && (
                <p style={{
                  color: "#b2dfdb",
                  fontSize: 13,
                  lineHeight: 1.6,
                  margin: "10px 0 0 0",
                  paddingTop: 10,
                  borderTop: "1px solid rgba(76,175,80,0.15)"
                }}><TermHighlighter text={q.explanation} accentColor="#a5d6a7" /></p>
              )}
            </div>
          )}

          {/* Next Button */}
          {selectedAnswer !== null && (
            <button
              onClick={nextQuestion}
              style={{
                width: "100%",
                padding: "16px",
                marginTop: 20,
                borderRadius: 12,
                border: "none",
                background: `linear-gradient(135deg, ${tc.accent}, ${tc.light})`,
                color: tc.bg,
                fontSize: 16,
                fontWeight: 700,
                cursor: "pointer",
                fontFamily: "'Georgia', serif",
                animation: "fadeUp 0.3s ease"
              }}
            >
              {currentQ + 1 >= quizQuestions.length ? "See Results" : "Next Question →"}
            </button>
          )}
        </div>

        <style>{`
          @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
          }
          @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
          }
        `}</style>
      </div>
    );
  }

  // RESULTS SCREEN
  if (screen === "results") {
    const pct = Math.round((score / quizQuestions.length) * 100);
    const grade = pct >= 70 ? "Grade A" : pct >= 60 ? "Grade B" : pct >= 50 ? "Grade C" : pct >= 40 ? "Grade D" : pct >= 30 ? "Grade E" : "Grade F";
    const gradeEmoji = pct >= 70 ? "🏆" : pct >= 60 ? "🌟" : pct >= 50 ? "👍" : pct >= 40 ? "📚" : pct >= 30 ? "📖" : "💪";
    const gradeColor = pct >= 70 ? "#66bb6a" : pct >= 60 ? "#aed581" : pct >= 50 ? "#ffd54f" : pct >= 40 ? "#ffb74d" : pct >= 30 ? "#ff8a65" : "#ef5350";
    const gradeMsg = pct >= 70 ? "Excellent — exam ready!" : pct >= 60 ? "Good — almost there" : pct >= 50 ? "Passing — keep practising" : pct >= 40 ? "Below pass — focus on weak topics" : pct >= 30 ? "Needs work — review the material" : "Significant revision needed";

    const topicStats = {};
    quizQuestions.forEach((q, i) => {
      if (!topicStats[q.topic]) topicStats[q.topic] = { correct: 0, total: 0 };
      topicStats[q.topic].total++;
      if (answers[i]?.correct) topicStats[q.topic].correct++;
    });

    const incorrectQs = answers.filter(a => !a.correct).map(a => ({
      ...quizQuestions[a.questionIdx],
      selectedAnswer: a.selected
    }));

    return (
      <div style={{
        minHeight: "100vh",
        background: "linear-gradient(135deg, #0c1821 0%, #162447 40%, #1f4068 100%)",
        padding: "40px 20px",
        fontFamily: "'Georgia', 'Cambria', serif"
      }}>
        <div style={{
          maxWidth: 640,
          margin: "0 auto",
          animation: "fadeUp 0.6s ease"
        }}>
          {/* Score Card */}
          <div style={{
            textAlign: "center",
            padding: "40px 30px",
            borderRadius: 20,
            background: "rgba(255,255,255,0.06)",
            border: "1px solid rgba(255,255,255,0.1)",
            marginBottom: 30
          }}>
            <div style={{ fontSize: 50, marginBottom: 10 }}>{gradeEmoji}</div>
            <div style={{
              fontSize: 56,
              fontWeight: 700,
              color: "#fff",
              lineHeight: 1
            }}>{pct}%</div>
            <div style={{
              color: gradeColor,
              fontSize: 28,
              marginTop: 8,
              fontWeight: 700
            }}>{grade}</div>
            <div style={{
              color: "#8eaccd",
              fontSize: 14,
              marginTop: 6,
              fontFamily: "'Trebuchet MS', sans-serif"
            }}>{gradeMsg}</div>
            <div style={{
              color: "#8eaccd",
              fontSize: 15,
              marginTop: 12,
              fontFamily: "'Trebuchet MS', sans-serif"
            }}>
              {score} correct out of {quizQuestions.length} questions
            </div>
          </div>

          {/* Topic Breakdown */}
          <div style={{
            background: "rgba(255,255,255,0.06)",
            borderRadius: 16,
            padding: 24,
            marginBottom: 30,
            border: "1px solid rgba(255,255,255,0.08)"
          }}>
            <div style={{
              color: "#8eaccd",
              fontSize: 12,
              letterSpacing: 3,
              textTransform: "uppercase",
              marginBottom: 16,
              fontFamily: "'Trebuchet MS', sans-serif"
            }}>Topic Breakdown</div>

            {Object.entries(topicStats).map(([topic, stats]) => {
              const tc = TOPIC_COLORS[topic];
              const topicPct = Math.round((stats.correct / stats.total) * 100);
              return (
                <div key={topic} style={{ marginBottom: 16 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                    <span style={{ color: "#e0e0e0", fontSize: 14 }}>{topic}</span>
                    <span style={{ color: tc.accent, fontSize: 14, fontWeight: 600, fontFamily: "'Trebuchet MS', sans-serif" }}>
                      {stats.correct}/{stats.total} ({topicPct}%)
                    </span>
                  </div>
                  <div style={{
                    height: 6,
                    background: "rgba(255,255,255,0.1)",
                    borderRadius: 3,
                    overflow: "hidden"
                  }}>
                    <div style={{
                      width: `${topicPct}%`,
                      height: "100%",
                      background: `linear-gradient(90deg, ${tc.light}, ${tc.accent})`,
                      borderRadius: 3,
                      transition: "width 0.6s ease"
                    }} />
                  </div>
                </div>
              );
            })}
          </div>

          {/* Incorrect Answers Review */}
          {incorrectQs.length > 0 && (
            <div style={{
              background: "rgba(255,255,255,0.06)",
              borderRadius: 16,
              padding: 24,
              marginBottom: 30,
              border: "1px solid rgba(255,255,255,0.08)"
            }}>
              <div style={{
                color: "#ffcc80",
                fontSize: 12,
                letterSpacing: 3,
                textTransform: "uppercase",
                marginBottom: 16,
                fontFamily: "'Trebuchet MS', sans-serif"
              }}>📖 Review — Questions You Got Wrong</div>

              {incorrectQs.map((q, i) => (
                <div key={i} style={{
                  padding: 20,
                  borderRadius: 12,
                  background: "rgba(255,255,255,0.04)",
                  border: "1px solid rgba(255,255,255,0.06)",
                  marginBottom: 16
                }}>
                  <div style={{
                    color: "#8eaccd",
                    fontSize: 11,
                    letterSpacing: 1.5,
                    textTransform: "uppercase",
                    marginBottom: 8,
                    fontFamily: "'Trebuchet MS', sans-serif"
                  }}>{q.topic}</div>
                  <div style={{ color: "#e0e0e0", fontSize: 14, lineHeight: 1.6, marginBottom: 12 }}>
                    <TermHighlighter text={q.question} accentColor="#ffd54f" />
                  </div>
                  <div style={{
                    display: "flex",
                    gap: 8,
                    flexWrap: "wrap",
                    marginBottom: 12
                  }}>
                    <span style={{
                      padding: "4px 10px",
                      borderRadius: 6,
                      background: "rgba(244,67,54,0.2)",
                      color: "#ef9a9a",
                      fontSize: 12,
                      fontFamily: "'Trebuchet MS', sans-serif"
                    }}>Your answer: {q.options[q.selectedAnswer]}</span>
                    <span style={{
                      padding: "4px 10px",
                      borderRadius: 6,
                      background: "rgba(76,175,80,0.2)",
                      color: "#a5d6a7",
                      fontSize: 12,
                      fontFamily: "'Trebuchet MS', sans-serif"
                    }}>Correct: {q.options[q.correct]}</span>
                  </div>
                  <div style={{
                    padding: "12px 14px",
                    borderRadius: 8,
                    background: "rgba(255,152,0,0.08)",
                    border: "1px solid rgba(255,152,0,0.15)"
                  }}>
                    <p style={{
                      color: "#bdbdbd",
                      fontSize: 13,
                      lineHeight: 1.6,
                      margin: 0
                    }}>💡 <TermHighlighter text={q.explanation} accentColor="#ffcc80" /></p>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Action Buttons */}
          <div style={{ display: "flex", gap: 12 }}>
            <button
              onClick={() => startQuiz(quizMode)}
              style={{
                flex: 1,
                padding: "16px",
                borderRadius: 12,
                border: "none",
                background: "linear-gradient(135deg, #f0c27f, #fc5c7d)",
                color: "#1a1a2e",
                fontSize: 16,
                fontWeight: 700,
                cursor: "pointer",
                fontFamily: "'Georgia', serif"
              }}
            >Try Again</button>
            <button
              onClick={() => setScreen("menu")}
              style={{
                flex: 1,
                padding: "16px",
                borderRadius: 12,
                border: "1px solid rgba(255,255,255,0.2)",
                background: "rgba(255,255,255,0.05)",
                color: "#e0e0e0",
                fontSize: 16,
                fontWeight: 600,
                cursor: "pointer",
                fontFamily: "'Georgia', serif"
              }}
            >Change Topics</button>
          </div>
          <button
            onClick={() => setScreen("progress")}
            style={{
              width: "100%",
              padding: "14px",
              marginTop: 10,
              borderRadius: 12,
              border: "1px solid rgba(255,255,255,0.12)",
              background: "rgba(255,255,255,0.04)",
              color: "#8eaccd",
              fontSize: 14,
              fontWeight: 600,
              cursor: "pointer",
              fontFamily: "'Georgia', serif"
            }}
          >📊 View My Progress</button>
        </div>

        <style>{`
          @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
          }
        `}</style>
      </div>
    );
  }

  // PROGRESS SCREEN
  if (screen === "progress") {
    // Calculate all-time stats
    const totalAttempts = scoreHistory.length;
    const allTimePct = totalAttempts > 0 ? Math.round(scoreHistory.reduce((s, h) => s + h.pct, 0) / totalAttempts) : 0;
    const bestPct = totalAttempts > 0 ? Math.max(...scoreHistory.map(h => h.pct)) : 0;
    const lastFive = scoreHistory.slice(-5);
    const recentAvg = lastFive.length > 0 ? Math.round(lastFive.reduce((s, h) => s + h.pct, 0) / lastFive.length) : 0;
    const trend = lastFive.length >= 2 ? lastFive[lastFive.length - 1].pct - lastFive[0].pct : 0;

    // Topic-level aggregation across all attempts
    const topicAll = {};
    scoreHistory.forEach(h => {
      Object.entries(h.topics || {}).forEach(([t, s]) => {
        if (!topicAll[t]) topicAll[t] = { correct: 0, total: 0 };
        topicAll[t].correct += s.correct;
        topicAll[t].total += s.total;
      });
    });
    const topicPcts = Object.entries(topicAll).map(([t, s]) => ({
      topic: t,
      pct: Math.round((s.correct / s.total) * 100),
      correct: s.correct,
      total: s.total
    })).sort((a, b) => a.pct - b.pct);

    const weakest = topicPcts.length > 0 ? topicPcts[0] : null;
    const strongest = topicPcts.length > 0 ? topicPcts[topicPcts.length - 1] : null;

    // SVG score trend chart
    const chartW = 380, chartH = 140, chartPad = 30;
    const recent10 = scoreHistory.slice(-10);
    const chartPoints = recent10.map((h, i) => {
      const x = chartPad + (i / Math.max(recent10.length - 1, 1)) * (chartW - 2 * chartPad);
      const y = chartH - chartPad - (h.pct / 100) * (chartH - 2 * chartPad);
      return [x, y];
    });

    return (
      <div style={{
        minHeight: "100vh",
        background: "linear-gradient(135deg, #0c1821 0%, #162447 40%, #1f4068 100%)",
        padding: "30px 20px",
        fontFamily: "'Georgia', 'Cambria', serif"
      }}>
        <div style={{ maxWidth: 640, margin: "0 auto", animation: "fadeUp 0.6s ease" }}>

          {/* Header */}
          <div style={{ textAlign: "center", marginBottom: 30 }}>
            <div style={{ fontSize: 12, letterSpacing: 5, color: "#8eaccd", textTransform: "uppercase", marginBottom: 8, fontFamily: "'Trebuchet MS', sans-serif" }}>Your Progress</div>
            <h1 style={{ fontSize: 30, color: "#fff", margin: 0, fontWeight: 700 }}>📊 Score Dashboard</h1>
          </div>

          {/* Exam Info Card */}
          <div style={{
            background: "linear-gradient(135deg, rgba(240,194,127,0.08), rgba(252,92,125,0.08))",
            borderRadius: 16,
            padding: "20px 22px",
            marginBottom: 24,
            border: "1px solid rgba(240,194,127,0.2)"
          }}>
            <div style={{ color: "#f0c27f", fontSize: 12, letterSpacing: 3, textTransform: "uppercase", marginBottom: 12, fontFamily: "'Trebuchet MS', sans-serif", fontWeight: 700 }}>📋 Exam Information — Week 7</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px 20px" }}>
              {[
                ["Format", "MCQ (multiple choice)"],
                ["Duration", "60 minutes"],
                ["Scope", "Lectures & tutorials up to Week 5"],
                ["Type", "Closed book — no notes"],
                ["Bring", "Pen, pencil, eraser, calculator"],
                ["Rule", "5 min late = no entry"],
              ].map(([label, value], i) => (
                <div key={i} style={{ display: "flex", gap: 8 }}>
                  <span style={{ color: "#8eaccd", fontSize: 12, fontFamily: "'Trebuchet MS', sans-serif", minWidth: 55 }}>{label}:</span>
                  <span style={{ color: "#e0e0e0", fontSize: 12, fontFamily: "'Trebuchet MS', sans-serif" }}>{value}</span>
                </div>
              ))}
            </div>
            <div style={{ marginTop: 14, borderTop: "1px solid rgba(255,255,255,0.08)", paddingTop: 12 }}>
              <div style={{ color: "#8eaccd", fontSize: 11, letterSpacing: 2, textTransform: "uppercase", marginBottom: 8, fontFamily: "'Trebuchet MS', sans-serif" }}>Course Learning Outcomes</div>
              {[
                "Assess models & frameworks for multinational enterprises and global economies",
                "Appraise information from sources to support decision-making in business economics",
                "Evaluate economic theories to develop policy recommendations",
                "Apply professional values and ethical principles"
              ].map((clo, i) => (
                <div key={i} style={{ color: "#b0bec5", fontSize: 11, lineHeight: 1.6, marginBottom: 4, fontFamily: "'Trebuchet MS', sans-serif", paddingLeft: 12 }}>
                  <span style={{ color: "#f0c27f" }}>{i + 1}.</span> {clo}
                </div>
              ))}
            </div>
          </div>

          {totalAttempts === 0 ? (
            <div style={{
              textAlign: "center",
              padding: "50px 30px",
              background: "rgba(255,255,255,0.04)",
              borderRadius: 16,
              border: "1px solid rgba(255,255,255,0.06)",
              marginBottom: 24
            }}>
              <div style={{ fontSize: 44, marginBottom: 12 }}>📝</div>
              <div style={{ color: "#e0e0e0", fontSize: 18, fontWeight: 600, marginBottom: 8 }}>No quiz attempts yet</div>
              <div style={{ color: "#8eaccd", fontSize: 14, fontFamily: "'Trebuchet MS', sans-serif" }}>Complete a quiz to start tracking your progress!</div>
            </div>
          ) : (
            <>
              {/* Stats Cards */}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12, marginBottom: 24 }}>
                {[
                  { label: "Attempts", value: totalAttempts, emoji: "🎯" },
                  { label: "Average", value: `${allTimePct}%`, emoji: "📈" },
                  { label: "Best", value: `${bestPct}%`, emoji: "🏆" },
                ].map((s, i) => (
                  <div key={i} style={{
                    background: "rgba(255,255,255,0.06)",
                    borderRadius: 14,
                    padding: "18px 12px",
                    textAlign: "center",
                    border: "1px solid rgba(255,255,255,0.08)"
                  }}>
                    <div style={{ fontSize: 22, marginBottom: 6 }}>{s.emoji}</div>
                    <div style={{ color: "#fff", fontSize: 24, fontWeight: 700, lineHeight: 1 }}>{s.value}</div>
                    <div style={{ color: "#8eaccd", fontSize: 11, marginTop: 6, fontFamily: "'Trebuchet MS', sans-serif", letterSpacing: 1 }}>{s.label}</div>
                  </div>
                ))}
              </div>

              {/* Trend + Recent Average */}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 24 }}>
                <div style={{
                  background: "rgba(255,255,255,0.06)",
                  borderRadius: 14,
                  padding: "16px",
                  border: "1px solid rgba(255,255,255,0.08)",
                  textAlign: "center"
                }}>
                  <div style={{ color: "#8eaccd", fontSize: 11, letterSpacing: 2, textTransform: "uppercase", marginBottom: 8, fontFamily: "'Trebuchet MS', sans-serif" }}>Last 5 avg</div>
                  <div style={{ color: "#fff", fontSize: 28, fontWeight: 700 }}>{recentAvg}%</div>
                </div>
                <div style={{
                  background: "rgba(255,255,255,0.06)",
                  borderRadius: 14,
                  padding: "16px",
                  border: "1px solid rgba(255,255,255,0.08)",
                  textAlign: "center"
                }}>
                  <div style={{ color: "#8eaccd", fontSize: 11, letterSpacing: 2, textTransform: "uppercase", marginBottom: 8, fontFamily: "'Trebuchet MS', sans-serif" }}>Trend</div>
                  <div style={{ color: trend > 0 ? "#66bb6a" : trend < 0 ? "#ef5350" : "#ffd54f", fontSize: 28, fontWeight: 700 }}>
                    {trend > 0 ? "↑" : trend < 0 ? "↓" : "→"} {Math.abs(trend)}%
                  </div>
                </div>
              </div>

              {/* Grade Scale */}
              <div style={{
                display: "flex",
                gap: 4,
                marginBottom: 24,
                borderRadius: 12,
                overflow: "hidden"
              }}>
                {[
                  { grade: "A", min: "70%+", color: "#66bb6a" },
                  { grade: "B", min: "60%", color: "#aed581" },
                  { grade: "C", min: "50%", color: "#ffd54f" },
                  { grade: "D", min: "40%", color: "#ffb74d" },
                  { grade: "E", min: "30%", color: "#ff8a65" },
                  { grade: "F", min: "<30%", color: "#ef5350" },
                ].map(g => (
                  <div key={g.grade} style={{
                    flex: 1,
                    padding: "10px 4px",
                    background: `${g.color}15`,
                    borderTop: `3px solid ${g.color}`,
                    textAlign: "center"
                  }}>
                    <div style={{ color: g.color, fontSize: 16, fontWeight: 800, fontFamily: "'Trebuchet MS', sans-serif" }}>{g.grade}</div>
                    <div style={{ color: "rgba(255,255,255,0.4)", fontSize: 9, fontFamily: "'Trebuchet MS', sans-serif", marginTop: 2 }}>{g.min}</div>
                  </div>
                ))}
              </div>

              {/* Score Trend Chart */}
              {recent10.length >= 2 && (
                <div style={{
                  background: "rgba(255,255,255,0.06)",
                  borderRadius: 16,
                  padding: "20px 16px 16px",
                  marginBottom: 24,
                  border: "1px solid rgba(255,255,255,0.08)"
                }}>
                  <div style={{ color: "#8eaccd", fontSize: 11, letterSpacing: 3, textTransform: "uppercase", marginBottom: 14, fontFamily: "'Trebuchet MS', sans-serif" }}>Score Trend (last {recent10.length} attempts)</div>
                  <svg viewBox={`0 0 ${chartW} ${chartH}`} style={{ width: "100%", maxWidth: chartW, display: "block" }}>
                    {/* Grid */}
                    {[0, 25, 50, 75, 100].map(v => {
                      const y = chartH - chartPad - (v / 100) * (chartH - 2 * chartPad);
                      return (
                        <g key={v}>
                          <line x1={chartPad} y1={y} x2={chartW - chartPad} y2={y} stroke="rgba(255,255,255,0.06)" strokeWidth="1" />
                          <text x={chartPad - 6} y={y + 4} textAnchor="end" fill="rgba(255,255,255,0.3)" fontSize="9" fontFamily="Trebuchet MS">{v}%</text>
                        </g>
                      );
                    })}
                    {/* 70% pass line */}
                    {(() => {
                      const y70 = chartH - chartPad - (70 / 100) * (chartH - 2 * chartPad);
                      return <line x1={chartPad} y1={y70} x2={chartW - chartPad} y2={y70} stroke="rgba(102,187,106,0.3)" strokeWidth="1.5" strokeDasharray="6,4" />;
                    })()}
                    {/* Area fill */}
                    <path
                      d={`${chartPoints.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0]},${p[1]}`).join(' ')} L${chartPoints[chartPoints.length-1][0]},${chartH - chartPad} L${chartPoints[0][0]},${chartH - chartPad} Z`}
                      fill="rgba(240,194,127,0.08)"
                    />
                    {/* Line */}
                    <path
                      d={chartPoints.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0]},${p[1]}`).join(' ')}
                      fill="none" stroke="#f0c27f" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
                    />
                    {/* Dots */}
                    {chartPoints.map((p, i) => (
                      <g key={i}>
                        <circle cx={p[0]} cy={p[1]} r="4" fill="#f0c27f" stroke="#0c1821" strokeWidth="2" />
                        <text x={p[0]} y={p[1] - 10} textAnchor="middle" fill="#f0c27f" fontSize="9" fontWeight="700" fontFamily="Trebuchet MS">{recent10[i].pct}%</text>
                      </g>
                    ))}
                  </svg>
                </div>
              )}

              {/* Topic Breakdown */}
              {topicPcts.length > 0 && (
                <div style={{
                  background: "rgba(255,255,255,0.06)",
                  borderRadius: 16,
                  padding: "20px 22px",
                  marginBottom: 24,
                  border: "1px solid rgba(255,255,255,0.08)"
                }}>
                  <div style={{ color: "#8eaccd", fontSize: 11, letterSpacing: 3, textTransform: "uppercase", marginBottom: 16, fontFamily: "'Trebuchet MS', sans-serif" }}>Topic Mastery (all attempts)</div>
                  {topicPcts.map(({ topic, pct, correct, total }) => {
                    const tc = TOPIC_COLORS[topic] || { accent: "#fff", light: "#888" };
                    const barColor = pct >= 70 ? "#66bb6a" : pct >= 50 ? "#ffd54f" : "#ef5350";
                    return (
                      <div key={topic} style={{ marginBottom: 14 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
                          <span style={{ color: "#e0e0e0", fontSize: 13 }}>{topic}</span>
                          <span style={{ color: barColor, fontSize: 13, fontWeight: 700, fontFamily: "'Trebuchet MS', sans-serif" }}>{pct}% <span style={{ fontWeight: 400, color: "#8eaccd", fontSize: 11 }}>({correct}/{total})</span></span>
                        </div>
                        <div style={{ height: 8, background: "rgba(255,255,255,0.08)", borderRadius: 4, overflow: "hidden" }}>
                          <div style={{
                            width: `${pct}%`,
                            height: "100%",
                            background: barColor,
                            borderRadius: 4,
                            transition: "width 0.6s ease"
                          }} />
                        </div>
                      </div>
                    );
                  })}

                  {/* Weakest / Strongest */}
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 18 }}>
                    {weakest && (
                      <div style={{ background: "rgba(239,83,80,0.1)", borderRadius: 10, padding: "12px", border: "1px solid rgba(239,83,80,0.2)" }}>
                        <div style={{ color: "#ef5350", fontSize: 10, letterSpacing: 2, textTransform: "uppercase", marginBottom: 4, fontFamily: "'Trebuchet MS', sans-serif" }}>⚠️ Focus area</div>
                        <div style={{ color: "#ffcdd2", fontSize: 13, fontWeight: 600 }}>{weakest.topic}</div>
                        <div style={{ color: "#ef9a9a", fontSize: 11, fontFamily: "'Trebuchet MS', sans-serif" }}>{weakest.pct}% accuracy</div>
                      </div>
                    )}
                    {strongest && (
                      <div style={{ background: "rgba(102,187,106,0.1)", borderRadius: 10, padding: "12px", border: "1px solid rgba(102,187,106,0.2)" }}>
                        <div style={{ color: "#66bb6a", fontSize: 10, letterSpacing: 2, textTransform: "uppercase", marginBottom: 4, fontFamily: "'Trebuchet MS', sans-serif" }}>💪 Strongest</div>
                        <div style={{ color: "#c8e6c9", fontSize: 13, fontWeight: 600 }}>{strongest.topic}</div>
                        <div style={{ color: "#a5d6a7", fontSize: 11, fontFamily: "'Trebuchet MS', sans-serif" }}>{strongest.pct}% accuracy</div>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* Attempt History */}
              <div style={{
                background: "rgba(255,255,255,0.06)",
                borderRadius: 16,
                padding: "20px 22px",
                marginBottom: 24,
                border: "1px solid rgba(255,255,255,0.08)"
              }}>
                <div style={{ color: "#8eaccd", fontSize: 11, letterSpacing: 3, textTransform: "uppercase", marginBottom: 14, fontFamily: "'Trebuchet MS', sans-serif" }}>Attempt History</div>
                <div style={{ maxHeight: 240, overflowY: "auto" }}>
                  {[...scoreHistory].reverse().map((h, i) => {
                    const d = new Date(h.date);
                    const dateStr = d.toLocaleDateString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
                    const color = h.pct >= 70 ? "#66bb6a" : h.pct >= 60 ? "#aed581" : h.pct >= 50 ? "#ffd54f" : h.pct >= 40 ? "#ffb74d" : "#ef5350";
                    const letterGrade = h.pct >= 70 ? "A" : h.pct >= 60 ? "B" : h.pct >= 50 ? "C" : h.pct >= 40 ? "D" : h.pct >= 30 ? "E" : "F";
                    return (
                      <div key={i} style={{
                        display: "flex",
                        justifyContent: "space-between",
                        alignItems: "center",
                        padding: "10px 0",
                        borderBottom: i < scoreHistory.length - 1 ? "1px solid rgba(255,255,255,0.05)" : "none"
                      }}>
                        <div>
                          <div style={{ color: "#e0e0e0", fontSize: 13 }}>Attempt #{scoreHistory.length - i}</div>
                          <div style={{ color: "#8eaccd", fontSize: 11, fontFamily: "'Trebuchet MS', sans-serif" }}>{dateStr}</div>
                        </div>
                        <div style={{ textAlign: "right", display: "flex", alignItems: "center", gap: 10 }}>
                          <div>
                            <div style={{ color, fontSize: 18, fontWeight: 700 }}>{h.pct}%</div>
                            <div style={{ color: "#8eaccd", fontSize: 11, fontFamily: "'Trebuchet MS', sans-serif" }}>{h.score}/{h.total}</div>
                          </div>
                          <div style={{
                            width: 32, height: 32, borderRadius: 8,
                            background: `${color}22`, border: `1px solid ${color}44`,
                            display: "flex", alignItems: "center", justifyContent: "center",
                            color, fontSize: 15, fontWeight: 800, fontFamily: "'Trebuchet MS', sans-serif"
                          }}>{letterGrade}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Reset button */}
              {!confirmReset ? (
                <button
                  onClick={() => setConfirmReset(true)}
                  style={{
                    width: "100%",
                    padding: "10px",
                    marginBottom: 12,
                    borderRadius: 10,
                    border: "1px solid rgba(239,83,80,0.2)",
                    background: "rgba(239,83,80,0.05)",
                    color: "#ef9a9a",
                    fontSize: 12,
                    cursor: "pointer",
                    fontFamily: "'Trebuchet MS', sans-serif"
                  }}
                >🗑 Reset All Progress</button>
              ) : (
                <div style={{
                  padding: "14px 18px",
                  marginBottom: 12,
                  borderRadius: 10,
                  border: "1px solid rgba(239,83,80,0.35)",
                  background: "rgba(239,83,80,0.1)"
                }}>
                  <div style={{ color: "#ffcdd2", fontSize: 13, marginBottom: 10, fontFamily: "'Trebuchet MS', sans-serif" }}>
                    Are you sure? This will delete all {scoreHistory.length} attempts permanently.
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button
                      onClick={() => {
                        setScoreHistory([]);
                        setConfirmReset(false);
                        (async () => { try { await window.storage.delete("quiz-score-history"); } catch(e) {} })();
                      }}
                      style={{
                        flex: 1,
                        padding: "8px",
                        borderRadius: 8,
                        border: "none",
                        background: "#ef5350",
                        color: "#fff",
                        fontSize: 12,
                        fontWeight: 700,
                        cursor: "pointer",
                        fontFamily: "'Trebuchet MS', sans-serif"
                      }}
                    >Yes, delete all</button>
                    <button
                      onClick={() => setConfirmReset(false)}
                      style={{
                        flex: 1,
                        padding: "8px",
                        borderRadius: 8,
                        border: "1px solid rgba(255,255,255,0.15)",
                        background: "rgba(255,255,255,0.05)",
                        color: "#e0e0e0",
                        fontSize: 12,
                        cursor: "pointer",
                        fontFamily: "'Trebuchet MS', sans-serif"
                      }}
                    >Cancel</button>
                  </div>
                </div>
              )}
            </>
          )}

          {/* Back buttons */}
          <div style={{ display: "flex", gap: 12 }}>
            <button
              onClick={() => setScreen("menu")}
              style={{
                flex: 1,
                padding: "16px",
                borderRadius: 12,
                border: "none",
                background: "linear-gradient(135deg, #f0c27f, #fc5c7d)",
                color: "#1a1a2e",
                fontSize: 16,
                fontWeight: 700,
                cursor: "pointer",
                fontFamily: "'Georgia', serif"
              }}
            >← Back to Quiz</button>
          </div>
        </div>

        <style>{`
          @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
          }
        `}</style>
      </div>
    );
  }

  // FLASHCARDS & FORMULA SHEET
  if (screen === "flashcards") {
    const FORMULAS = [
      { cat: "Costs", term: "Total Cost", formula: "TC = TFC + TVC", desc: "Total cost equals total fixed costs plus total variable costs." },
      { cat: "Costs", term: "Average Cost", formula: "AC = TC / Q", desc: "Total cost divided by quantity. Also AC = AFC + AVC." },
      { cat: "Costs", term: "Average Fixed Cost", formula: "AFC = TFC / Q", desc: "Fixed costs per unit. Falls continuously as output rises." },
      { cat: "Costs", term: "Average Variable Cost", formula: "AVC = TVC / Q", desc: "Variable costs per unit. The shut-down point is at minimum AVC." },
      { cat: "Costs", term: "Marginal Cost", formula: "MC = ΔTC / ΔQ", desc: "The extra cost of producing one more unit. Crosses AC at its minimum." },
      { cat: "Revenue", term: "Total Revenue", formula: "TR = P × Q", desc: "Price times quantity sold. Maximised where MR = 0." },
      { cat: "Revenue", term: "Average Revenue", formula: "AR = TR / Q = P", desc: "Revenue per unit = price. The AR curve IS the demand curve." },
      { cat: "Revenue", term: "Marginal Revenue", formula: "MR = ΔTR / ΔQ", desc: "Extra revenue from selling one more unit. For price makers: MR < AR." },
      { cat: "Revenue", term: "MR for linear demand", formula: "If P = a − bQ, then MR = a − 2bQ", desc: "MR has the same intercept but twice the slope of the demand curve." },
      { cat: "Profit", term: "Profit", formula: "π = TR − TC", desc: "Total revenue minus total cost. Normal profit is when TR = TC." },
      { cat: "Profit", term: "Profit Maximisation", formula: "MC = MR (and MC rising)", desc: "Produce where MC crosses MR from below. Works for ALL market structures." },
      { cat: "Profit", term: "Supernormal Profit", formula: "TR > TC (or P > AC)", desc: "Profit above normal profit. Attracts new entrants in competitive markets." },
      { cat: "Profit", term: "Shut-down condition", formula: "Shut down if P < AVC", desc: "In short run, keep going if P ≥ AVC (covers variable costs). Shut down if not." },
      { cat: "Elasticity", term: "PED", formula: "PED = %ΔQD / %ΔP", desc: "Price elasticity of demand. Elastic if |PED| > 1, inelastic if < 1." },
      { cat: "Elasticity", term: "YED", formula: "YED = %ΔQD / %ΔY", desc: "Income elasticity. Positive = normal good, negative = inferior good, > 1 = luxury." },
      { cat: "Elasticity", term: "XED", formula: "XED = %ΔQDᵃ / %ΔPᵇ", desc: "Cross-price elasticity. Positive = substitutes, negative = complements." },
      { cat: "Elasticity", term: "TR & Elasticity", formula: "Elastic → cut price ↑TR\nInelastic → raise price ↑TR", desc: "If demand is elastic, lower prices to increase revenue. If inelastic, raise them." },
      { cat: "Macro", term: "GDP (expenditure)", formula: "AD = C + I + G + X − M", desc: "Aggregate demand: Consumption + Investment + Gov spending + Exports − Imports." },
      { cat: "Macro", term: "Unemployment Rate", formula: "(Unemployed / Labour Force) × 100", desc: "Labour force = employed + unemployed. Divide unemployed by the total." },
      { cat: "Macro", term: "Inflation Rate", formula: "((New − Old) / Old) × 100", desc: "Percentage change in the price index between two periods." },
      { cat: "Macro", term: "Real GDP", formula: "Real GDP = (Nominal / Deflator) × 100", desc: "Strips out inflation to show real changes in output." },
      { cat: "Macro", term: "Equilibrium", formula: "J = W (I+G+X = S+T+M)", desc: "National income is in equilibrium when injections equal withdrawals." },
      { cat: "Efficiency", term: "Allocative Efficiency", formula: "P = MC", desc: "Resources allocated to where consumers value them most." },
      { cat: "Efficiency", term: "Productive Efficiency", formula: "Min AC", desc: "Producing at the lowest possible average cost — no waste." },
      { cat: "Externalities", term: "Social Optimum", formula: "MSB = MSC", desc: "Social efficiency: marginal social benefit equals marginal social cost." },
      { cat: "Externalities", term: "External Cost", formula: "MEC = MSC − MPC", desc: "The gap between social and private cost — the cost to third parties." },
      { cat: "Opportunity Cost", term: "Opportunity Cost", formula: "Value of next best alternative forgone", desc: "What you give up to get something. Central to all economic reasoning." },
    ];

    const categories = [...new Set(FORMULAS.map(f => f.cat))];
    const filtered = flashcardCategory === "all" ? FORMULAS : FORMULAS.filter(f => f.cat === flashcardCategory);
    const card = filtered[flashcardIdx % filtered.length];
    const cardCatColor = {
      "Costs": "#42a5f5", "Revenue": "#aed581", "Profit": "#ff7043",
      "Elasticity": "#ea80fc", "Macro": "#29b6f6", "Efficiency": "#66bb6a",
      "Externalities": "#ffd54f", "Opportunity Cost": "#f0c27f"
    };

    return (
      <div style={{
        minHeight: "100vh",
        background: "linear-gradient(135deg, #0c1821 0%, #1a2744 40%, #1f4068 100%)",
        padding: "30px 20px",
        fontFamily: "'Georgia', 'Cambria', serif"
      }}>
        <div style={{ maxWidth: 560, margin: "0 auto", animation: "fadeUp 0.6s ease" }}>

          <div style={{ textAlign: "center", marginBottom: 24 }}>
            <div style={{ fontSize: 12, letterSpacing: 5, color: "#ffd54f", textTransform: "uppercase", marginBottom: 8, fontFamily: "'Trebuchet MS', sans-serif" }}>Study Tool</div>
            <h1 style={{ fontSize: 28, color: "#fff", margin: 0, fontWeight: 700 }}>📇 Flashcards & Formulas</h1>
          </div>

          {/* Category Filter */}
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 20, justifyContent: "center" }}>
            <button onClick={() => { setFlashcardCategory("all"); setFlashcardIdx(0); setFlashcardFlipped(false); }} style={{
              padding: "6px 14px", borderRadius: 20, border: flashcardCategory === "all" ? "1px solid #ffd54f" : "1px solid rgba(255,255,255,0.12)",
              background: flashcardCategory === "all" ? "rgba(255,213,79,0.15)" : "rgba(255,255,255,0.04)",
              color: flashcardCategory === "all" ? "#ffd54f" : "#8eaccd", fontSize: 12, cursor: "pointer", fontFamily: "'Trebuchet MS', sans-serif", fontWeight: 600
            }}>All</button>
            {categories.map(c => (
              <button key={c} onClick={() => { setFlashcardCategory(c); setFlashcardIdx(0); setFlashcardFlipped(false); }} style={{
                padding: "6px 14px", borderRadius: 20,
                border: flashcardCategory === c ? `1px solid ${cardCatColor[c] || "#fff"}` : "1px solid rgba(255,255,255,0.12)",
                background: flashcardCategory === c ? `${cardCatColor[c] || "#fff"}20` : "rgba(255,255,255,0.04)",
                color: flashcardCategory === c ? (cardCatColor[c] || "#fff") : "#8eaccd",
                fontSize: 12, cursor: "pointer", fontFamily: "'Trebuchet MS', sans-serif", fontWeight: 600
              }}>{c}</button>
            ))}
          </div>

          {/* Card counter */}
          <div style={{ textAlign: "center", color: "#8eaccd", fontSize: 12, marginBottom: 12, fontFamily: "'Trebuchet MS', sans-serif" }}>
            {(flashcardIdx % filtered.length) + 1} / {filtered.length}
          </div>

          {/* The Flashcard */}
          <div
            onClick={() => setFlashcardFlipped(!flashcardFlipped)}
            style={{
              background: flashcardFlipped ? "rgba(255,255,255,0.08)" : "rgba(255,255,255,0.05)",
              borderRadius: 20,
              padding: "40px 28px",
              minHeight: 200,
              display: "flex",
              flexDirection: "column",
              alignItems: "center",
              justifyContent: "center",
              cursor: "pointer",
              border: `1px solid ${flashcardFlipped ? (cardCatColor[card.cat] || "#fff") + "44" : "rgba(255,255,255,0.08)"}`,
              transition: "all 0.3s ease",
              marginBottom: 16,
              textAlign: "center",
              position: "relative"
            }}
          >
            {!flashcardFlipped ? (
              <>
                <div style={{ color: cardCatColor[card.cat] || "#ffd54f", fontSize: 11, letterSpacing: 2, textTransform: "uppercase", marginBottom: 12, fontFamily: "'Trebuchet MS', sans-serif" }}>{card.cat}</div>
                <div style={{ color: "#fff", fontSize: 22, fontWeight: 700, marginBottom: 12 }}>{card.term}</div>
                <div style={{ color: "rgba(255,255,255,0.3)", fontSize: 12, fontFamily: "'Trebuchet MS', sans-serif" }}>Tap to reveal →</div>
              </>
            ) : (
              <>
                <div style={{ color: cardCatColor[card.cat] || "#ffd54f", fontSize: 11, letterSpacing: 2, textTransform: "uppercase", marginBottom: 8, fontFamily: "'Trebuchet MS', sans-serif" }}>{card.term}</div>
                <div style={{
                  color: "#ffd54f", fontSize: 26, fontWeight: 800, marginBottom: 14,
                  fontFamily: "'Trebuchet MS', monospace", letterSpacing: 1, whiteSpace: "pre-line"
                }}>{card.formula}</div>
                <div style={{ color: "#b0bec5", fontSize: 14, lineHeight: 1.6, fontFamily: "'Trebuchet MS', sans-serif" }}>{card.desc}</div>
              </>
            )}
          </div>

          {/* Nav buttons */}
          <div style={{ display: "flex", gap: 10, marginBottom: 24 }}>
            <button
              onClick={() => { setFlashcardIdx(i => (i - 1 + filtered.length) % filtered.length); setFlashcardFlipped(false); }}
              style={{
                flex: 1, padding: "14px", borderRadius: 12,
                border: "1px solid rgba(255,255,255,0.15)", background: "rgba(255,255,255,0.05)",
                color: "#e0e0e0", fontSize: 16, fontWeight: 600, cursor: "pointer", fontFamily: "'Georgia', serif"
              }}
            >← Previous</button>
            <button
              onClick={() => { setFlashcardIdx(i => (i + 1) % filtered.length); setFlashcardFlipped(false); }}
              style={{
                flex: 1, padding: "14px", borderRadius: 12,
                border: "none", background: "linear-gradient(135deg, #f0c27f, #fc5c7d)",
                color: "#1a1a2e", fontSize: 16, fontWeight: 700, cursor: "pointer", fontFamily: "'Georgia', serif"
              }}
            >Next →</button>
          </div>

          <button
            onClick={() => {
              const shuffled = shuffleArray([...Array(filtered.length).keys()]);
              setFlashcardIdx(shuffled[0]);
              setFlashcardFlipped(false);
            }}
            style={{
              width: "100%", padding: "12px", borderRadius: 12, marginBottom: 10,
              border: "1px solid rgba(255,213,79,0.2)", background: "rgba(255,213,79,0.06)",
              color: "#ffd54f", fontSize: 13, cursor: "pointer", fontFamily: "'Trebuchet MS', sans-serif", fontWeight: 600
            }}
          >🔀 Shuffle</button>

          {/* Formula Reference Sheet */}
          <div style={{
            background: "rgba(255,255,255,0.04)", borderRadius: 16, padding: "20px 18px",
            marginBottom: 20, border: "1px solid rgba(255,255,255,0.06)"
          }}>
            <div style={{ color: "#8eaccd", fontSize: 11, letterSpacing: 3, textTransform: "uppercase", marginBottom: 14, fontFamily: "'Trebuchet MS', sans-serif" }}>📋 Quick Reference — All Formulas</div>
            {categories.map(cat => (
              <div key={cat} style={{ marginBottom: 14 }}>
                <div style={{ color: cardCatColor[cat] || "#fff", fontSize: 12, fontWeight: 700, marginBottom: 6, fontFamily: "'Trebuchet MS', sans-serif", letterSpacing: 1 }}>{cat.toUpperCase()}</div>
                {FORMULAS.filter(f => f.cat === cat).map((f, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", borderBottom: "1px solid rgba(255,255,255,0.03)" }}>
                    <span style={{ color: "#b0bec5", fontSize: 12, fontFamily: "'Trebuchet MS', sans-serif" }}>{f.term}</span>
                    <span style={{ color: "#e0e0e0", fontSize: 12, fontWeight: 600, fontFamily: "'Trebuchet MS', monospace" }}>{f.formula.split('\n')[0]}</span>
                  </div>
                ))}
              </div>
            ))}
          </div>

          <button
            onClick={() => setScreen("menu")}
            style={{
              width: "100%", padding: "16px", borderRadius: 12, border: "none",
              background: "linear-gradient(135deg, #f0c27f, #fc5c7d)", color: "#1a1a2e",
              fontSize: 16, fontWeight: 700, cursor: "pointer", fontFamily: "'Georgia', serif"
            }}
          >← Back to Menu</button>
        </div>

        <style>{`
          @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
          }
        `}</style>
      </div>
    );
  }

  return null;
}

  </script>
</body>
</html>
